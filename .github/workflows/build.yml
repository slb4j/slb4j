name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'liberica'
          java-package: 'jdk+fx'
          cache: 'gradle'

      - name: Start xvfb
        if: runner.os == 'Linux'
        run: Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

      - name: Build with Gradle
        run: ./gradlew build
        env:
          DISPLAY: ":99"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}
          path: "**/build/reports"

      - name: Detect prepared release
        if: runner.os == 'Linux'
        id: prepared-release
        run: |
          if [[ -f gradle/prepared-release.toml ]]; then
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepared=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare tested release bundle
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref_protected && steps.prepared-release.outputs.prepared == 'true'
        run: ./gradlew --no-daemon --no-configuration-cache -PciReleaseBundle=true prepareCiReleaseBundle

      - name: Upload tested release bundle
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref_protected && steps.prepared-release.outputs.prepared == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            build/staging-deploy
            build/release-bundle/manifest.sha256
            build/release-bundle/metadata.properties
          if-no-files-found: error
