name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Azul Zulu JDK 21 (Full)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          java-package: 'jdk+fx'
          cache: 'gradle'

      - name: Start xvfb
        if: runner.os == 'Linux'
        run: Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

      - name: Build with Gradle
        run: ./gradlew build
        env:
          DISPLAY: ":99"

  publish:
    name: Publish to Maven Central
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Azul Zulu JDK 21 (Full)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          java-package: 'jdk+fx'
          cache: 'gradle'

      - name: Check if version is not SNAPSHOT
        run: |
          VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if [[ $VERSION == *"SNAPSHOT"* ]]; then
            echo "SNAPSHOT version detected. Skipping publishing."
            exit 1
          fi

      - name: Publish to Maven Central
        run: |
          ./gradlew publishToStagingDirectory
          ./gradlew jreleaserDeploy
        env:
          JRELEASER_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          JRELEASER_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}

      - name: Upload Javadoc to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/docs/javadoc
          target-folder: javadoc/${{ env.VERSION }}

      - name: Increment patch version and add SNAPSHOT
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Logic to increment patch version
          # Assuming version is in Meta.VERSION in build.gradle.kts
          CURRENT_VERSION=${{ env.VERSION }}
          # Handle x.y, x.y.z, and versions with suffixes like -beta, -alpha
          if [[ $CURRENT_VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(.*)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            SUFFIX="${BASH_REMATCH[4]}"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}-SNAPSHOT"
          elif [[ $CURRENT_VERSION =~ ^([0-9]+)\.([0-9]+)(.*)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            SUFFIX="${BASH_REMATCH[3]}"
            # If there's a suffix like -beta, we might want to move to .1-SNAPSHOT or just strip it
            # Given 0.1-beta, the user likely wants 0.1.1-SNAPSHOT or 0.2.0-SNAPSHOT
            # The previous logic for x.y was to produce x.y.1-SNAPSHOT
            NEW_VERSION="${MAJOR}.${MINOR}.1-SNAPSHOT"
          else
            echo "Unexpected version format: $CURRENT_VERSION"
            exit 1
          fi
          
          sed -i "s/const val VERSION = \"$CURRENT_VERSION\"/const val VERSION = \"$NEW_VERSION\"/" build.gradle.kts
          
          git add build.gradle.kts
          git commit -m "Prepare for next development cycle: $NEW_VERSION"
          git push origin main
