name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Azul Zulu JDK 21 (Full)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          java-package: 'jdk+fx'
          cache: 'gradle'

      - name: Start xvfb
        if: runner.os == 'Linux'
        run: Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

      - name: Build with Gradle
        run: ./gradlew build
        env:
          DISPLAY: ":99"

  publish:
    name: Publish to Maven Central
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Azul Zulu JDK 21 (Full)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          java-package: 'jdk+fx'
          cache: 'gradle'

      - name: Check if version is not SNAPSHOT
        run: |
          VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if [[ $VERSION == *"SNAPSHOT"* ]]; then
            echo "SNAPSHOT version detected. Skipping publishing."
            exit 1
          fi

      - name: Publish to Maven Central
        run: |
          ./gradlew publishToStagingDirectory
          ./gradlew jreleaserDeploy
        env:
          JRELEASER_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          JRELEASER_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}

      - name: Upload Javadoc to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/docs/javadoc
          target-folder: javadoc/${{ env.VERSION }}

      - name: Increment patch version and add SNAPSHOT
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          CURRENT_VERSION=${{ env.VERSION }}
          
          if [[ $CURRENT_VERSION =~ ^([0-9]+)(\.[0-9]+)*$ ]]; then
            # Simple version like x, x.y, x.y.z
            if [[ $CURRENT_VERSION =~ (.*)\.([0-9]+)$ ]]; then
              BASE="${BASH_REMATCH[1]}"
              PATCH="${BASH_REMATCH[2]}"
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="${BASE}.${NEW_PATCH}-SNAPSHOT"
            else
              # Only a single number
              NEW_VERSION="${CURRENT_VERSION}.1-SNAPSHOT"
            fi
          else
            # Version string has some text appended
            if [[ $CURRENT_VERSION =~ (.*[^0-9])([0-9]+)$ ]]; then
              # Ends with a number
              PREFIX="${BASH_REMATCH[1]}"
              NUMBER="${BASH_REMATCH[2]}"
              NEW_NUMBER=$((NUMBER + 1))
              NEW_VERSION="${PREFIX}${NEW_NUMBER}"
            else
              # Does not end with a number
              NEW_VERSION="${CURRENT_VERSION}1"
            fi
          fi
          
          echo "Incrementing version: $CURRENT_VERSION -> $NEW_VERSION"
          sed -i "s/const val VERSION = \"$CURRENT_VERSION\"/const val VERSION = \"$NEW_VERSION\"/" build.gradle.kts
          
          git add build.gradle.kts
          git commit -m "Prepare for next development cycle: $NEW_VERSION"
          git push origin main
