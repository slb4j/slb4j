Configuration:
  status: DEBUG
  Appenders:
    Console:
      name: STDOUT
      target: SYSTEM_OUT
      ThresholdFilter:
        level: INFO
        onMatch: ACCEPT
        onMismatch: DENY
      PatternLayout:
        pattern: "%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"
  Loggers:
    Root:
      level: INFO
      AppenderRef:
        ref: STDOUT
    Logger:
      name: org.slb4j.test
      level: DEBUG
