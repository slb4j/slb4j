# Global status for internal Logging backend errors
status = WARN

# Define the Appender
appender.console.type = Console
appender.console.name = LogToConsole
appender.console.target = SYSTEM_OUT

# Define the Layout
appender.console.layout.type = PatternLayout
# Note: %highlight and %disableAnsi=false enable the colors
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %highlight{%-5level} %logger{36} (%F:%L) - %msg%n%throwable

# Define the Filter (Correct syntax for global filtering)
rootLogger.level = INFO
rootLogger.appenderRef.stdout.ref = LogToConsole
