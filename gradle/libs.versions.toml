[plugins]
cabe = { id = "com.dua3.cabe", version = "4.0.2" }
graalvm = { id = "org.graalvm.buildtools.native", version = "0.11.4" }
jdkprovider = { id = "com.dua3.gradle.jdkprovider", version = "0.4.0" }
jmh = { id = "me.champeau.jmh", version = "0.7.3" }
jreleaser = { id = "org.jreleaser", version = "1.22.0" }
spotbugs = { id = "com.github.spotbugs", version = "6.4.8" }
versions = { id = "com.github.ben-manes.versions", version = "0.53.0" }

[versions]
commons-logging = "1.3.5"
jmh = "1.37"
jspecify = "1.0.0"
junit-bom = "6.0.2"
log4j = "2.25.3"
logback = "1.5.25"
slf4j = "2.0.17"

[libraries]
# basic modules
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit-bom" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

# JMH
jmh-core = { group = "org.openjdk.jmh", name = "jmh-core", version.ref = "jmh" }

# common
log4j-bom = { group = "org.apache.logging.log4j", name = "log4j-bom", version.ref = "log4j" }

# facades
jcl = { group = "commons-logging", name = "commons-logging", version.ref = "commons-logging" }
log4j-api = { group = "org.apache.logging.log4j", name = "log4j-api" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }

# backends
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core" }

# bridges
jcl-to-log4j = { group = "org.apache.logging.log4j", name = "log4j-jcl" }
jcl-to-slf4j = { group = "org.slf4j", name = "jcl-over-slf4j", version.ref = "slf4j" }

jul-to-slf4j = { group = "org.slf4j", name = "jul-to-slf4j", version.ref = "slf4j" }
jul-to-log4j = { group = "org.apache.logging.log4j", name = "log4j-jul" }

log4j-to-slf4j = { group = "org.apache.logging.log4j", name = "log4j-to-slf4j" }
log4j-to-jul = { group = "org.apache.logging.log4j", name = "log4j-to-jul" }

slf4j-to-jul = { group = "org.slf4j", name = "slf4j-jdk14", version.ref = "slf4j" }
slf4j-to-log4j = { group = "org.apache.logging.log4j", name = "log4j-slf4j2-impl" }

