# Global filter configuration
filter.main.level=DEBUG
filter.main.rule.org.slb4j.native_test.special=TRACE
filter.main.rule.org.slb4j.native_test.restricted=WARN

# Console Appender
appender.console.type=console
appender.console.target=SYSTEM_OUT
appender.console.colored=true
appender.console.layout.type = PatternLayout
appender.console.layout.pattern=%highlight{%d{HH:mm:ss.SSS} [%t] %-5level %logger{1.} - %msg}%n%ex
appender.console.filter=main

# File Appender
appender.file.type=file
appender.file.fileName=test-file.log
appender.file.append=false
appender.file.layout.type = PatternLayout
appender.file.layout.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger - %msg%n
appender.file.filter=main

# Rotating File Appender
appender.rolling.type=rollingfile
appender.rolling.fileName=test-rolling.log

# Note: RotatingFileHandler currently does not support full date patterns in filePattern, it just uses the string.
appender.rolling.filePattern=test-rolling-%i.log
appender.rolling.policies.size.size=1KB
appender.rolling.strategy.max=3
appender.rolling.layout.pattern=%d{ISO8601} [%t] %-5p %marker %c [%X] (%class.%method(%file:%line)) - %m%n%throwable
appender.rolling.filter=main
